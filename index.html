function dash(){app.innerHTML='<h1>Teacher dashboard</h1><p class="mu" id="st">Loading…</p><div id="d"></div><button id="hm">Home</button>';document.getElementById("hm").onclick=home;
if(!db){document.getElementById("st").textContent="Database unavailable.";return}render()}
function render(){var d=document.getElementById("d");if(!d)return;
var rows=allRows.filter(function(r){return DP==="all"||r.paper===DP});document.getElementById("st").textContent=rows.length+" submission(s)";
var avg=rows.length?Math.round(rows.reduce(function(a,r){return a+r.score/r.total*100},0)/rows.length):0,st={};
rows.forEach(function(r){var m=r.res||{};for(var id in m){var q=ALLM[id];if(!q)continue;var s=st[id]||(st[id]={n:0,c:0,w:{}});s.n++;if(m[id]===q.a)s.c++;else if(m[id])s.w[m[id]]=(s.w[m[id]]||0)+1}});
var qs=Object.keys(st).map(function(id){var s=st[id],m="",mx=0;for(var l in s.w)if(s.w[l]>mx){mx=s.w[l];m=l}return{id:id,n:s.n,p:Math.round(s.c/s.n*100),w:m}}).sort(function(a,b){return a.p-b.p});
d.innerHTML='<select id="dp">'+papOpts(DP,"All papers")+'</select><div class="card"><b>Average score: '+avg+'%</b></div><div class="card sc"><table><tr><th>Name</th><th>Class</th><th>Paper</th><th>Score</th><th>Time</th></tr>'+rows.slice().sort(function(a,b){return b.score/b.total-a.score/a.total}).map(function(r){return'<tr><td>'+h(r.name)+'</td><td>'+h(r.cls)+'</td><td>'+h(NAMES[r.paper]||"Mixed")+'</td><td>'+r.score+'/'+r.total+'</td><td>'+Math.floor(r.secs/60)+'m '+r.secs%60+'s</td></tr>'}).join("")+'</table></div><div class="card sc"><b>Question accuracy (hardest first)</b><table><tr><th>Question</th><th>% correct</th><th></th><th>Most common wrong</th><th>Attempts</th></tr>'+qs.map(function(x){var q=ALLM[x.id];return'<tr><td>'+NAMES[q.p]+' Q'+q.n+'</td><td>'+x.p+'%</td><td style="width:30%"><div class="bar"><i style="width:'+x.p+'%"></i></div></td><td>'+(x.w||"–")+'</td><td>'+x.n+'</td></tr>'}).join("")+'</table></div>';
var ds=document.getElementById("dp");ds.onchange=function(){DP=ds.value;render()}}
home();
(async function(){try{usr=await claude.use("user");db=await claude.use("db");if(usr&&usr.id)uid=await usr.id();if(!uid)uid="s"+Math.random().toString(36).slice(2,10);if(!S.name)home();
if(db)db.collection("results").onSnapshot(function(sn){allRows=sn.docs.map(function(x){return x.data()});render()},function(){})}catch(e){}})();
</script></body></html>
